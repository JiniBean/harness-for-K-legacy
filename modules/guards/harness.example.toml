# 프로젝트 하네스 설정 예시. set-up-harness가 <프로젝트>/.agents/harness.toml 로 채운다.
# 같은 키는 전역 ~/.agents/harness.toml 보다 이 파일이 우선한다. 로더: ~/.agents/scripts/harness_config.py
# 켠 기능의 키는 각 modules/<이름>/MODULE.md 「설정 키」를 보고 이 아래에 더한다.
# 비밀값(계정·비밀번호·토큰)은 여기에 쓰지 않는다 → <secrets_dir>/<name>/<이름>.env

name = ""               # 프로젝트 이름. 비밀 폴더 이름(<secrets_dir>/<name>/)

[harness]
modules = []            # 이 프로젝트에 설치한 기능 id (set-up-harness가 기록. 전역에 설치한 기능은 전역 harness.toml)
tools = []              # 연결한 도구: "claude", "cursor", "codex"

[person]
author = ""             # 변경 이력 주석·문서 작성자
alias = ""              # 테스트 데이터 키 접두 등 짧은 이름

[org]
company = ""
base_package = ""       # 기본 패키지(있을 때)

[verify]
debug_patterns = []     # C_DEBUG가 찾는 디버그 출력 정규식. set-up-harness가 스택에 맞게 채움 (예: "System\\.out\\.print", "console\\.log")

[guard]
# 훅 정책. 훅을 등록한 뒤에는 사용자가 hook_approval 단어를 단독 입력한 턴에만 바뀐다
hook_approval = "gohook"    # 보호된 훅·[guard]를 한 턴만 풀어 주는 단어
block_hosts = []            # 셸 직접 접속을 막을 DB 호스트
ftp_hosts = []              # 셸 직접 접속을 막을 FTP·로그 서버
shell_block_patterns = []   # 셸 명령에서 막을 정규식(모듈 조각이 더함)
